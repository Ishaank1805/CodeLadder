[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codeladder"
version = "0.1.0"
description = "Risk-controlled model cascades for code generation: repair, resample, escalate or abstain with a statistical guarantee."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Team Byte Me (Ekansh, Ishaan, Ayush)" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "openai>=1.40",
]

[project.optional-dependencies]
benchmarks = [
  "evalplus>=0.3.1",
]
energy = [
  "nvidia-ml-py>=12.535",
]
analysis = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "packaging>=23",  # scripts/verify_wheels.py
]

[project.scripts]
codeladder = "codeladder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
codeladder = ["demo_page.html", "bcb_bin/*"]
