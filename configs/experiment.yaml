# Experiment settings. Paths are relative to the repo root unless absolute.

paths:
  pools: data/pools          # cached generations + execution results, one JSON per (benchmark, tier, task)
  llm_cache: data/llm_cache          # one SQLite file per (tier, benchmark), single writer each
  results: results
  stress: data/lcb/stress    # model-written stress inputs for stdin tasks (make-stress)
  baselines: data/baselines  # generation for published baselines (make-selftests, make-traces)

generation:
  n_samples: 20              # independent samples per task per tier
  temperature: 0.8
  top_p: 0.95
  max_tokens: 1024
  seed: 0
  repair:
    # Repair chains are built for the first N samples that fail a visible test. Replays
    # shuffle sample order, so keep this >= n_samples or repair policies get starved
    # (the controller falls back to resampling when no chain exists, and logs it).
    parents: 20
    depth: 3                 # repair rounds per chain (stops early once visible tests pass)

# Per-benchmark overrides of the generation settings above. LiveCodeBench problems are
# longer and harder, so fewer samples and repair rounds keep the GPU budget realistic.
generation_overrides:
  livecodebench:
    n_samples: 10
    max_tokens: 2048
    repair: {parents: 10, depth: 2}
  bigcodebench:              # X18: same budget as LiveCodeBench
    n_samples: 10
    max_tokens: 2048
    repair: {parents: 10, depth: 2}

# Per-tier overrides (applied after the per-benchmark ones). The free API tier keeps to what the
# controller uses at the top of the ladder (at most 8 draws) and to the daily quota: 8 samples,
# no repair chains; its reasoning tokens count against max_tokens.
tier_overrides:
  # DeepSeek-Coder mostly declines to rate its code ("as an AI, I cannot execute code"; 40 to
  # 95% of replies had no number), so its answer is prefilled with "Confidence (0-100): " and
  # it only has to continue with the number.
  d1: {conf_max_tokens: 8, conf_prefill: true}
  d2: {conf_max_tokens: 8, conf_prefill: true}
  d3: {conf_max_tokens: 8, conf_prefill: true}
  api:
    n_samples: 8
    max_tokens: 4096
    repair: {parents: 0, depth: 0}
    conf_max_tokens: 512     # the confidence rating also comes after reasoning

probes:
  n: 20                      # extra inputs for behavioural agreement (never the hidden tests)
  seed: 0

execution:
  per_call_timeout_s: 2.0
  total_timeout_cap_s: 60    # cap per sandbox run (HumanEval+ has ~1,000 hidden inputs per task)
  hidden_chunk: 250          # hidden tests run in chunks; stop at the first failing chunk
  ref_time_factor: 4.0       # hidden-test budget is at least this multiple of the reference runtime
  memory_mb: 2048
  memory_mb_hidden: 4096      # hidden tests: a few tasks have huge outputs (Mbpp/255)
  max_workers: 8             # parallel sandboxed executions

controller:
  n_init: 3                  # samples drawn before the first accept check at each tier
  max_draws: 8               # samples + repairs per tier before escalating
  action: resample           # resample | repair | adaptive
  permutations: 5            # replay each task with this many shuffled sample orders

evaluation:
  alphas: [0.05, 0.10]
  delta: 0.1
  n_splits: 100
  calib_frac: 0.5
  lambda_grid: {start: 1.0, stop: 0.0, step: 0.05}
  family: two_level          # shared: one threshold for all tiers (fixed-sequence testing)
                             # two_level: escalation + final-tier thresholds (see two_level_method)
  lambda_grid_2d: {start: 1.0, stop: 0.0, step: 0.1}
  two_level_method: paths    # paths: Bonferroni over fixed escalation thresholds (all data)
                             # pareto: Pareto Testing (half the calibration data orders configs)
  escalation_thresholds: [1.01, 0.9, 0.7, 0.5]
  cost_metric: weighted_tokens   # weighted_tokens | tokens | energy_j | gpu_s
